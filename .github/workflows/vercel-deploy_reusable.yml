# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: "Vercel deploy (reusable)"

on:
  workflow_call:
    # The caller waits for this run's build and, for production, infrastructure.
    secrets:
      VERCEL_TOKEN:
        required: true
    inputs:
      production:
        description: "Deploy the prebuilt output to production."
        required: false
        type: boolean
        default: false
    outputs:
      url:
        description: "Deployment URL"
        value: ${{ jobs.deploy.outputs.url }}

permissions: {}
env:
  VERCEL_ORG_ID: team_Ade0MlfC3211ml3wYJZ4c9hn
  VERCEL_PROJECT_ID: prj_0uRTXTGHFdN9SlHnFfNiahIgX3mc
  VERCEL_TELEMETRY_DISABLED: "1"
  # renovate: datasource=npm depName=vercel
  VERCEL_CLI_VERSION: "65.14.0"

jobs:
  deploy:
    name: "Deploy prebuilt ${{ inputs.production && 'production' || 'preview' }}"
    if: ${{ !inputs.production || github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ inputs.production && 'production' || 'preview' }}
    permissions:
      contents: read
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    steps:
      # No checkout, repository scripts or build hooks execute here.
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "26"
      - name: Download this run's prebuilt output
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vercel-output-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Validate and extract prebuilt output
        run: |
          # BEGIN PREBUILT EXTRACTOR
          python3 - prebuilt.tar.gz <<'PYTHON'
          """Validate an untrusted build archive before extracting it in a token-bearing job."""
          import json
          import pathlib
          import sys
          import tarfile


          def extract(archive, destination):
              root = pathlib.Path(destination).resolve()
              prefix = pathlib.PurePosixPath('.vercel/output')
              with tarfile.open(archive, 'r:gz') as source:
                  members = source.getmembers()
                  for member in members:
                      name = pathlib.PurePosixPath(member.name)
                      if name.is_absolute() or '..' in name.parts or not name.is_relative_to(prefix):
                          raise ValueError('Build archive path leaves .vercel/output')
                      if any(part == '.env' or part.startswith('.env.') for part in name.parts):
                          raise ValueError('Build archive contains an environment file')
                      if not (member.isfile() or member.isdir() or member.issym()):
                          raise ValueError('Unsupported build archive entry')
                      if member.issym():
                          target = (root / name.parent / member.linkname).resolve()
                          if pathlib.PurePosixPath(member.linkname).is_absolute() or not target.is_relative_to(root / prefix):
                              raise ValueError('Build archive link leaves .vercel/output')
                  source.extractall(root, members=members, filter='data')
              # filePathMap is interpreted by the upload CLI. It must never read runner files.
              for config in (root / prefix / 'functions').rglob('.vc-config.json'):
                  mapping = json.loads(config.read_text()).get('filePathMap', {})
                  if not isinstance(mapping, dict):
                      raise ValueError('Invalid function dependency map')
                  for destination, source in mapping.items():
                      if not isinstance(source, str) or not isinstance(destination, str):
                          raise ValueError('Invalid function dependency path')
                      path = pathlib.PurePosixPath(source)
                      target = pathlib.PurePosixPath(destination)
                      for value in (path, target):
                          if value.is_absolute() or '..' in value.parts or '\\' in str(value) or any(part == '.env' or part.startswith('.env.') for part in value.parts):
                              raise ValueError('Unsafe function dependency path')
                      if not path.is_relative_to(prefix / 'runtime-files') or not (root / path).resolve().is_relative_to(root / prefix) or not (root / path).exists():
                          raise ValueError('Function dependency leaves the packaged output')


          if __name__ == '__main__':
              extract(sys.argv[1], '.')
          PYTHON
          # END PREBUILT EXTRACTOR
          # The CLI validates the remote rootDirectory even for a prebuilt upload.
          mkdir -p apps/web
          # The destination is fixed by this workflow, never by the uploaded project metadata.
          node -e 'require("node:fs").writeFileSync(".vercel/project.json", JSON.stringify({orgId:process.env.VERCEL_ORG_ID,projectId:process.env.VERCEL_PROJECT_ID}))'
      - name: Install the pinned deployment CLI without lifecycle scripts
        run: npm install --global --ignore-scripts --no-audit --no-fund --prefix "$HOME/.vercel-cli" "vercel@${VERCEL_CLI_VERSION}"
      - name: Deploy
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          PRODUCTION: ${{ inputs.production }}
        run: |
          if [ "$PRODUCTION" = "true" ]; then
            url="$("$HOME/.vercel-cli/bin/vercel" deploy --prebuilt --archive=tgz --prod --yes)"
          else
            url="$("$HOME/.vercel-cli/bin/vercel" deploy --prebuilt --archive=tgz --yes)"
          fi
          DEPLOYMENT_URL="$url" node --input-type=module -e '
            const value = process.env.DEPLOYMENT_URL;
            const url = new URL(value);
            if (url.protocol !== "https:" || url.origin !== value || !url.hostname.endsWith(".vercel.app")) process.exit(1);
          '
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Summary
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
          TARGET: ${{ inputs.production && 'Production' || 'Preview' }}
        run: |
          {
            echo "### ${TARGET} deployment"
            echo
            echo "- Deployment: ${DEPLOYMENT_URL}"
          } >> "$GITHUB_STEP_SUMMARY"
