name: Extension release

on:
  push:
    tags: ['extension-v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing protected extension-vX.Y.Z tag on main'
        required: true
        type: string
      browser:
        description: 'Browser stores to release'
        type: choice
        options: [all, chrome, firefox, safari]
        default: all
      dry_run:
        description: 'Build and test only; no store credentials or writes'
        type: boolean
        default: true

permissions:
  contents: read

# Shared with status updates. Never cancel a submission that may already have reached the store.
concurrency:
  group: extension-production-store-item
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      commit: ${{ steps.resolve.outputs.commit }}
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
      - name: Verify release tag, main ancestry and version
        id: resolve
        env:
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
        run: node apps/extension/scripts/resolve-release.mjs
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ steps.resolve.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck && pnpm build && pnpm -C packages/extension test && pnpm -C apps/extension test
      - name: Validate and package every browser target
        run: |
          pnpm -C apps/extension validate
          pnpm -C apps/extension package
          pnpm -C apps/extension-firefox validate
          pnpm -C apps/extension-firefox lint:store
          pnpm -C apps/extension-firefox package
          pnpm -C apps/extension-firefox test
          pnpm -C apps/extension-safari validate
          pnpm -C apps/extension-safari package
          pnpm -C apps/extension-safari test
      - name: Retain the exact committed source for Mozilla reviewers
        env:
          RELEASE_TAG: ${{ steps.resolve.outputs.tag }}
        run: pnpm -C packages/extension release:source ../../apps/extension-firefox/release
      - run: pnpm -C apps/extension exec playwright install chromium
      - name: Test the unchanged production ZIP against the local API
        run: pnpm -C apps/extension test:package
      - run: pnpm -C apps/extension store:assets
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: extension-release-package
          path: apps/extension/release/
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: extension-release-tests
          path: |
            apps/extension/test-results/
            apps/extension/playwright-report/
          retention-days: 90
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: extension-firefox-release-package
          path: apps/extension-firefox/release/
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: extension-safari-release-resources
          path: apps/extension-safari/release/
          if-no-files-found: error
          retention-days: 90
      - name: Record dry-run outcome
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        run: echo 'Dry-run complete. Tested package retained; no store authentication or submission occurred.' >> "$GITHUB_STEP_SUMMARY"

  publish:
    needs: build
    if: (github.event_name == 'push' || !inputs.dry_run) && (github.event_name == 'push' || inputs.browser == 'all' || inputs.browser == 'chrome')
    runs-on: ubuntu-slim
    timeout-minutes: 10
    environment: extension-production
    permissions:
      contents: write # Draft release artifacts and durable submission receipts only.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.build.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
      - name: Check explicit release gates before requesting Google credentials
        env:
          RELEASE_REF_PROTECTED: ${{ github.ref_protected }}
          CWS_PUBLISHING_ENABLED: ${{ vars.CWS_PUBLISHING_ENABLED }}
          EXTENSION_HOSTED_ACCEPTANCE_URL: ${{ vars.EXTENSION_HOSTED_ACCEPTANCE_URL }}
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          GCP_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
          CWS_PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
          CWS_EXTENSION_ID: ${{ vars.CWS_EXTENSION_ID }}
        run: node apps/extension/scripts/release-gates.mjs
      - name: Recheck trusted tag
        env:
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.build.outputs.commit }}
        run: node apps/extension/scripts/resolve-release.mjs
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: extension-release-package
          path: apps/extension/release/
      - name: Obtain a short-lived publisher access token
        id: google
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/chromewebstore
          create_credentials_file: false
          export_environment_variables: false
      - name: Upload or reconcile the tested version and submit for review
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          CWS_PUBLISHING_ENABLED: ${{ vars.CWS_PUBLISHING_ENABLED }}
          EXTENSION_HOSTED_ACCEPTANCE_URL: ${{ vars.EXTENSION_HOSTED_ACCEPTANCE_URL }}
          CWS_PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
          CWS_EXTENSION_ID: ${{ vars.CWS_EXTENSION_ID }}
          CWS_ACCESS_TOKEN: ${{ steps.google.outputs.access_token }}
        run: node apps/extension/scripts/publish.mjs submit
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: extension-store-receipt
          path: apps/extension/release/*.store.json
          if-no-files-found: ignore
          retention-days: 90

  safari-native:
    name: Safari native archive (unsigned)
    needs: build
    if: github.event_name == 'push' || inputs.browser == 'all' || inputs.browser == 'safari'
    runs-on: macos-15
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.build.outputs.commit }}
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: extension-safari-release-resources
          path: apps/extension-safari/release/
      - name: Verify and extract the retained Safari resources
        env:
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
        run: pnpm -C packages/extension release:extract safari
      - run: pnpm -C apps/extension-safari native:build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: extension-safari-native-evidence
          path: apps/extension-safari/release/native/
          retention-days: 30

  firefox-publish:
    needs: [build, publish]
    if: >-
      always() && !cancelled() && needs.build.result == 'success' &&
      (needs.publish.result == 'success' || needs.publish.result == 'skipped') &&
      (github.event_name == 'push' || !inputs.dry_run) &&
      (github.event_name == 'push' || inputs.browser == 'all' || inputs.browser == 'firefox') &&
      vars.FIREFOX_PUBLISHING_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: extension-firefox-production
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.build.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Recheck the immutable release tag
        env:
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.build.outputs.commit }}
        run: node apps/extension/scripts/resolve-release.mjs
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: extension-firefox-release-package
          path: apps/extension-firefox/release/
      - name: Submit the retained ZIP and source to Mozilla
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          RELEASE_REF_PROTECTED: ${{ github.ref_protected }}
          FIREFOX_PUBLISHING_ENABLED: ${{ vars.FIREFOX_PUBLISHING_ENABLED }}
          HOSTED_ACCEPTANCE_URL: ${{ vars.FIREFOX_HOSTED_ACCEPTANCE_URL }}
          AMO_API_KEY: ${{ secrets.AMO_API_KEY }}
          AMO_API_SECRET: ${{ secrets.AMO_API_SECRET }}
        run: pnpm -C apps/extension-firefox publish:store
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: extension-firefox-store-receipt
          path: apps/extension-firefox/release/*.store.json
          if-no-files-found: ignore
          retention-days: 90

  safari-publish:
    # Serialize journal changes after both store jobs; do not race draft-release creation.
    needs: [build, publish, firefox-publish, safari-native]
    if: >-
      always() && !cancelled() && needs.build.result == 'success' && needs.safari-native.result == 'success' &&
      (needs.publish.result == 'success' || needs.publish.result == 'skipped') &&
      (needs.firefox-publish.result == 'success' || needs.firefox-publish.result == 'skipped') &&
      (github.event_name == 'push' || !inputs.dry_run) &&
      (github.event_name == 'push' || inputs.browser == 'all' || inputs.browser == 'safari') &&
      vars.SAFARI_PUBLISHING_ENABLED == 'true'
    runs-on: macos-15
    timeout-minutes: 45
    environment: extension-safari-production
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.build.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Recheck the immutable release tag
        env:
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.build.outputs.commit }}
        run: node apps/extension/scripts/resolve-release.mjs
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: extension-safari-release-resources
          path: apps/extension-safari/release/
      - name: Check Safari release gates before importing certificates
        env:
          RELEASE_REF_PROTECTED: ${{ github.ref_protected }}
          SAFARI_PUBLISHING_ENABLED: ${{ vars.SAFARI_PUBLISHING_ENABLED }}
          HOSTED_ACCEPTANCE_URL: ${{ vars.SAFARI_HOSTED_ACCEPTANCE_URL }}
        run: node packages/extension/scripts/release-gates.mjs safari
      - name: Import distribution and installer certificates into a temporary keychain
        # The previous step checks all owner gates before this action receives signing secrets.
        uses: Apple-Actions/import-codesign-certs@288b8ec97b82c66b6f2a6baaf7acc8dfbcbe331c # v7.2.0
        with:
          p12-file-base64: ${{ secrets.SAFARI_CERTIFICATES_P12_BASE64 }}
          p12-password: ${{ secrets.SAFARI_CERTIFICATES_P12_PASSWORD }}
      - name: Sign, upload, and optionally submit the Safari app for review
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          RELEASE_REF_PROTECTED: ${{ github.ref_protected }}
          SAFARI_PUBLISHING_ENABLED: ${{ vars.SAFARI_PUBLISHING_ENABLED }}
          HOSTED_ACCEPTANCE_URL: ${{ vars.SAFARI_HOSTED_ACCEPTANCE_URL }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          ASC_APP_ID: ${{ vars.ASC_APP_ID }}
          ASC_KEY_ID: ${{ vars.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ vars.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          SAFARI_SIGNING_IDENTITY: ${{ vars.SAFARI_SIGNING_IDENTITY }}
          SAFARI_APP_PROFILE_BASE64: ${{ secrets.SAFARI_APP_PROFILE_BASE64 }}
          SAFARI_EXTENSION_PROFILE_BASE64: ${{ secrets.SAFARI_EXTENSION_PROFILE_BASE64 }}
          SAFARI_SUBMIT_FOR_REVIEW: ${{ vars.SAFARI_SUBMIT_FOR_REVIEW }}
          SAFARI_METADATA_READY: ${{ vars.SAFARI_METADATA_READY }}
        run: pnpm -C apps/extension-safari publish:store
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: extension-safari-store-receipt
          path: |
            apps/extension-safari/release/*.store.json
            apps/extension-safari/release/native/build.json
          if-no-files-found: ignore
          retention-days: 90
