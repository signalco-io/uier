name: Extension release

on:
  push:
    tags: ['extension-v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing protected extension-vX.Y.Z tag on main'
        required: true
        type: string
      dry_run:
        description: 'Build and test only; no store credentials or writes'
        type: boolean
        default: true

permissions:
  contents: read

# Shared with status updates. Never cancel a submission that may already have reached the store.
concurrency:
  group: extension-production-store-item
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      commit: ${{ steps.resolve.outputs.commit }}
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
      - name: Verify release tag, main ancestry and version
        id: resolve
        env:
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
        run: node apps/extension/scripts/resolve-release.mjs
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ steps.resolve.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck && pnpm build && pnpm -C apps/extension test
      - run: pnpm -C apps/extension validate && pnpm -C apps/extension package
      - run: pnpm -C apps/extension exec playwright install chromium
      - name: Test the unchanged production ZIP against the local API
        run: pnpm -C apps/extension test:package
      - run: pnpm -C apps/extension store:assets
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: extension-release-package
          path: apps/extension/release/
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: extension-release-tests
          path: |
            apps/extension/test-results/
            apps/extension/playwright-report/
          retention-days: 90
      - name: Record dry-run outcome
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        run: echo 'Dry-run complete. Tested package retained; no store authentication or submission occurred.' >> "$GITHUB_STEP_SUMMARY"

  publish:
    needs: build
    if: github.event_name == 'push' || !inputs.dry_run
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: extension-production
    permissions:
      contents: write # Draft release artifacts and durable submission receipts only.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.build.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
      - name: Check explicit release gates before requesting Google credentials
        env:
          RELEASE_REF_PROTECTED: ${{ github.ref_protected }}
          CWS_PUBLISHING_ENABLED: ${{ vars.CWS_PUBLISHING_ENABLED }}
          EXTENSION_HOSTED_ACCEPTANCE_URL: ${{ vars.EXTENSION_HOSTED_ACCEPTANCE_URL }}
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          GCP_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
          CWS_PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
          CWS_EXTENSION_ID: ${{ vars.CWS_EXTENSION_ID }}
        run: node apps/extension/scripts/release-gates.mjs
      - name: Recheck trusted tag
        env:
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.build.outputs.commit }}
        run: node apps/extension/scripts/resolve-release.mjs
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: extension-release-package
          path: apps/extension/release/
      - name: Obtain a short-lived publisher access token
        id: google
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/chromewebstore
          create_credentials_file: false
          export_environment_variables: false
      - name: Upload or reconcile the tested version and submit for review
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          CWS_PUBLISHING_ENABLED: ${{ vars.CWS_PUBLISHING_ENABLED }}
          EXTENSION_HOSTED_ACCEPTANCE_URL: ${{ vars.EXTENSION_HOSTED_ACCEPTANCE_URL }}
          CWS_PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
          CWS_EXTENSION_ID: ${{ vars.CWS_EXTENSION_ID }}
          CWS_ACCESS_TOKEN: ${{ steps.google.outputs.access_token }}
        run: node apps/extension/scripts/publish.mjs submit
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: extension-store-receipt
          path: apps/extension/release/*.store.json
          if-no-files-found: ignore
          retention-days: 90
