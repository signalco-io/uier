# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: "CI"

on:
  pull_request:
  workflow_dispatch:

# A newer push to the same PR supersedes the running CI.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  changes:
    name: "Detect changes"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      # Manual runs check everything (infra preview only from main: Azure OIDC trusts only main and PRs).
      web: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.web }}
      infra: ${{ github.event_name == 'workflow_dispatch' && github.ref_name == 'main' && 'true' || steps.filter.outputs.infra }}
    steps:
      - name: Filter changed paths
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v4
        with:
          filters: |
            web:
              - "apps/**"
              - "packages/**"
              - "package.json"
              - "pnpm-lock.yaml"
              - "pnpm-workspace.yaml"
              - "turbo.json"
              - "tsconfig*.json"
              - ".npmrc"
              - ".nvmrc"
              - ".github/workflows/ci.yml"
              - ".github/workflows/vercel-deploy_reusable.yml"
              - ".github/workflows/notifications.yml"
            infra:
              - "infra/**"
              - ".nvmrc"
              - ".github/workflows/ci.yml"
              - ".github/workflows/pulumi_reusable.yml"

  web:
    name: "Web (typecheck, build, e2e)"
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # No .next/cache cache: Turbopack production builds don't use it, and CI never runs on main,
      # so PRs had nothing to restore while saving it cost seconds at the end of every run.

      # Pinned to the exact release: the floating v6 tag (v6.0.10) predates pnpm v12 support.
      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      # Tests run headless, so only the headless shell is needed (not full Chromium). No --with-deps:
      # the runner image ships Google Chrome, so its system libraries are already installed, and the
      # apt step took most of this step's time. If they ever go missing, Playwright fails at launch
      # with "Host system is missing dependencies"; add --with-deps back then.
      - name: Install Playwright browsers
        working-directory: apps/web
        run: pnpm exec playwright install --only-shell chromium

      - name: End-to-end tests
        run: pnpm test

      - name: Upload Playwright results
        # Successful launch measurements/screenshots are release evidence too.
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: |
            apps/web/test-results/
            apps/web/playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  infra:
    name: "Infra (pulumi preview)"
    needs: changes
    # Secrets are not available to PRs from forks.
    if: >-
      needs.changes.outputs.infra == 'true' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    uses: ./.github/workflows/pulumi_reusable.yml
    with:
      command: preview
    secrets:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      AZURE_STORAGE_ACCOUNT: ${{ secrets.AZURE_STORAGE_ACCOUNT }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

  preview:
    name: "Web (Vercel preview)"
    needs: changes
    # Secrets are not available to PRs from forks.
    if: >-
      needs.changes.outputs.web == 'true' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    permissions:
      contents: read
    uses: ./.github/workflows/vercel-deploy_reusable.yml
    with:
      production: false
    secrets:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

  ci-ok:
    # Single required status check: fails if any job failed or was cancelled; skipped jobs are fine.
    name: "CI OK"
    needs: [changes, web, infra, preview]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Check job results
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          if echo "$RESULTS" | jq -e '[.[].result] | any(. == "failure" or . == "cancelled")' > /dev/null; then
            echo "::error::One or more CI jobs failed or were cancelled."
            exit 1
          fi
