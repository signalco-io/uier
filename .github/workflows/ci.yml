# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: "CI"

on:
  pull_request:
  workflow_dispatch:

# A newer push to the same PR supersedes the running CI.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  changes:
    name: "Detect changes"
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      # Manual infra previews use the separate preview environment, only on main.
      web: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.web }}
      extension: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.extension }}
      infra: ${{ github.event_name == 'workflow_dispatch' && github.ref_name == 'main' && 'true' || steps.filter.outputs.infra }}
      skills: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.skills }}
    steps:
      - name: Filter changed paths
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        with:
          filters: |
            web:
              - "apps/**"
              - "packages/**"
              - "package.json"
              - "pnpm-lock.yaml"
              - "pnpm-workspace.yaml"
              - "turbo.json"
              - ".browserslistrc"
              - "tsconfig*.json"
              - ".npmrc"
              - ".nvmrc"
              - ".github/workflows/ci.yml"
              - ".github/workflows/deploy.yml"
              - ".github/workflows/deploy-current_reusable.yml"
              - ".github/workflows/vercel-*_reusable.yml"
              - ".github/workflows/notifications.yml"
              - ".github/vercel-project.json"
              - ".github/indexnow.json"
              - ".github/scripts/**"
            extension:
              - "apps/extension/**"
              - "apps/extension-firefox/**"
              - "apps/web/**"
              - "packages/**"
              - "package.json"
              - "pnpm-lock.yaml"
              - "pnpm-workspace.yaml"
              - "turbo.json"
              - "tsconfig*.json"
              - ".nvmrc"
              - ".browserslistrc"
              - ".github/workflows/ci.yml"
              - ".github/workflows/extension-*.yml"
            infra:
              - "infra/**"
              - ".nvmrc"
              - ".github/workflows/ci.yml"
              - ".github/workflows/pulumi_reusable.yml"
            skills:
              - "plugins/**"
              - ".claude-plugin/**"
              - ".agents/plugins/**"
              - ".agents/skills/uier-monitor*"
              - ".claude/skills/uier-monitor/**"
              - ".claude/skills/uier-monitor-script/**"
              - ".claude/skills/uier-monitor*"
              - ".github/scripts/agent-plugins*"
              - "LICENSE"
              - "apps/web/public/android-chrome-192x192.png"
              - ".github/workflows/ci.yml"

  web:
    name: "Web (${{ matrix.suite }})"
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        suite: [checks, api, browser]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Pinned to the exact release: the floating v6 tag (v6.0.10) predates pnpm v12 support.
      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Turbo tasks
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .turbo/cache
          key: turbo-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml', '.nvmrc') }}-web-${{ matrix.suite }}-${{ github.sha }}-${{ github.run_attempt }}
          restore-keys: |
            turbo-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml', '.nvmrc') }}-

      # Next 16.3+ persists Turbopack's compiler cache. Main's Vercel build seeds it for PRs;
      # Next still invalidates changed sources/configuration and regenerates all build output.
      - name: Cache Next.js compiler
        if: matrix.suite != 'checks'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: apps/web/.next/cache
          key: next-build-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml', '.nvmrc') }}-${{ github.sha }}
          restore-keys: |
            next-build-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml', '.nvmrc') }}-

      - name: Typecheck
        if: matrix.suite == 'checks'
        run: pnpm typecheck

      - name: Build
        if: matrix.suite != 'checks'
        run: pnpm exec turbo run build --filter=@uier/web

      - name: Validate deployment artifact boundaries
        if: matrix.suite == 'checks'
        run: |
          python3 .github/scripts/test_prebuilt.py
          node --test .github/scripts/package_prebuilt.test.mjs .github/scripts/search-index.test.mjs .github/scripts/deployment-current.test.mjs .github/scripts/turbo-cache.test.mjs

      - name: Package the standalone worker
        if: matrix.suite == 'checks'
        run: node apps/web/scripts/build-notifications.mjs

      # Tests run headless, so only the headless shell is needed (not full Chromium). No --with-deps:
      # the runner image ships Google Chrome, so its system libraries are already installed, and the
      # apt step took most of this step's time. If they ever go missing, Playwright fails at launch
      # with "Host system is missing dependencies"; add --with-deps back then.
      - name: Install Playwright browsers
        if: matrix.suite == 'browser'
        working-directory: apps/web
        run: pnpm exec playwright install --only-shell chromium

      - name: API tests
        if: matrix.suite == 'api'
        timeout-minutes: 5
        run: pnpm -C apps/web exec playwright test --project=API

      - name: Browser essentials
        if: matrix.suite == 'browser'
        timeout-minutes: 5
        run: pnpm -C apps/web exec playwright test --project="Desktop Chrome" --project="Mobile Chrome"

      # Keep the ordinary artifact for the strict CSP audit above; Next's test-only bootstrap
      # injects inline scripts that do not belong in the production allowlist.
      - name: Build instant navigation artifact
        if: matrix.suite == 'browser'
        env:
          UIER_INSTANT_TEST: '1'
        run: pnpm exec turbo run build --filter=@uier/web

      - name: Instant navigation contracts
        if: matrix.suite == 'browser'
        timeout-minutes: 5
        run: pnpm -C apps/web exec playwright test --config=playwright.instant.config.ts

      - name: Upload Playwright results
        # Successful launch measurements/screenshots are release evidence too.
        if: always() && matrix.suite != 'checks'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright-results-${{ matrix.suite }}
          path: |
            apps/web/test-results/
            apps/web/playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  infra:
    name: "Infra (pulumi preview)"
    needs: changes
    # Secrets are not available to PRs from forks.
    if: >-
      needs.changes.outputs.infra == 'true' &&
      ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) ||
       (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    uses: ./.github/workflows/pulumi_reusable.yml
    # Explicit names enable the target job environment to supply its secrets.
    secrets:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      AZURE_STORAGE_ACCOUNT: ${{ secrets.AZURE_STORAGE_ACCOUNT }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      UIER_INTEGRATION_ENV: ""
      ANTHROPIC_API_KEY: ""
    with:
      command: preview

  preview-build:
    name: "Web (preview build)"
    needs: changes
    # Secrets are not available to PRs from forks.
    if: >-
      needs.changes.outputs.web == 'true' &&
      ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) ||
       (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
    permissions:
      contents: read
    uses: ./.github/workflows/vercel-build_reusable.yml

  preview:
    name: "Web (Vercel preview)"
    needs: preview-build
    permissions:
      contents: read
    uses: ./.github/workflows/vercel-deploy_reusable.yml
    # Explicit names enable the target job environment to supply its secrets.
    secrets:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    with:
      production: false

  extension:
    name: "Extension (packaged runtime)"
    needs: changes
    if: needs.changes.outputs.extension == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Cache Turbo tasks
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .turbo/cache
          key: turbo-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml', '.nvmrc') }}-extension-${{ github.sha }}-${{ github.run_attempt }}
          restore-keys: |
            turbo-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml', '.nvmrc') }}-
      - name: Cache Next.js compiler
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: apps/web/.next/cache
          key: next-build-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml', '.nvmrc') }}-${{ github.sha }}
          restore-keys: |
            next-build-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml', '.nvmrc') }}-
      - run: pnpm typecheck && pnpm build
      - run: pnpm -C packages/extension test && pnpm -C apps/extension validate && pnpm -C apps/extension package && pnpm -C apps/extension test
      - name: Validate and package Firefox resources
        run: |
          pnpm -C apps/extension-firefox validate
          pnpm -C apps/extension-firefox package
          pnpm -C apps/extension-firefox lint:store
          pnpm -C apps/extension-firefox test
      # Persistent extension contexts require full Chromium, not the web job's headless shell.
      - run: pnpm -C apps/extension exec playwright install chromium
      - run: pnpm -C apps/extension test:package
      - run: pnpm -C apps/extension store:assets
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: extension-runtime-evidence
          path: |
            apps/extension/release/
            apps/extension-firefox/release/
            apps/extension/playwright-report/
            apps/extension/test-results/

  skills:
    name: "Agent skills"
    needs: changes
    if: needs.changes.outputs.skills == 'true'
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc

      # Skills are single-sourced in the plugin; adapters and the fallback script are generated.
      - name: Check the uier agent plugin
        run: |
          node .github/scripts/agent-plugins.mjs --check
          node --check plugins/uier/skills/uier-monitor/scripts/monitor.mjs
          node --check plugins/uier/skills/uier-monitor/scripts/dashboard.mjs
          node plugins/uier/skills/uier-monitor/scripts/build-script-skill.mjs --check
          node --test .github/scripts/agent-plugins.test.mjs plugins/uier/skills/uier-monitor/scripts/monitor.test.mjs plugins/uier/skills/uier-monitor/scripts/dashboard.test.mjs

  ci-ok:
    # Single required status check: fails if any job failed or was cancelled; skipped jobs are fine.
    name: "CI OK"
    needs: [changes, web, infra, preview-build, preview, extension, skills]
    if: always()
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Check job results
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          if echo "$RESULTS" | jq -e '[.[].result] | any(. == "failure" or . == "cancelled")' > /dev/null; then
            echo "::error::One or more CI jobs failed or were cancelled."
            exit 1
          fi

  extension-release:
    name: "Continue daily extension release"
    needs: ci-ok
    if: >-
      always() && !cancelled() &&
      needs.ci-ok.result == 'success' &&
      ((github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/extension-release/v')) ||
       (github.event_name == 'pull_request' && github.event.pull_request.user.login == 'github-actions[bot]' &&
        startsWith(github.head_ref, 'extension-release/v')))
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Dispatch finalization from main after CI OK
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail
          version="${RELEASE_BRANCH#extension-release/v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then exit 1; fi
          gh workflow run extension-release-finish.yml --repo "$GITHUB_REPOSITORY" --ref main -f "version=$version" -f "ci_run_id=$GITHUB_RUN_ID"
