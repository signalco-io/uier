# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

# Runs a Pulumi command for the "uier" project (infra/) against its production stack.
#
# Callers must grant the job that calls this workflow:
#   contents: read, id-token: write (Azure OIDC login)
#   pull-requests: write            (only for `preview` on pull requests, to comment the result)
# The jobs below declare no permissions of their own, so they get exactly what the caller grants.

name: "Pulumi (reusable)"

on:
  workflow_call:
    # Callers name each allowed secret; the job environment supplies the values.
    secrets:
      AZURE_CLIENT_ID:
        required: true
      AZURE_TENANT_ID:
        required: true
      AZURE_SUBSCRIPTION_ID:
        required: true
      AZURE_STORAGE_ACCOUNT:
        required: true
      VERCEL_TOKEN:
        required: true
      CLOUDFLARE_API_TOKEN:
        required: true
      UIER_INTEGRATION_ENV:
        required: true
      ANTHROPIC_API_KEY:
        required: true
    inputs:
      command:
        description: "Pulumi command to run: preview or up"
        required: true
        type: string

jobs:
  pulumi:
    name: "pulumi ${{ inputs.command }} (uier-production)"
    runs-on: ubuntu-latest
    environment: ${{ inputs.command == 'up' && 'production' || 'preview' }}
    timeout-minutes: 30
    # Never run two `up`s at once. Previews are read-only and get a unique group so they never
    # replace a pending `up` (a newer pending run in a group replaces the older pending one).
    concurrency:
      group: ${{ inputs.command == 'up' && 'pulumi-uier-production-up' || format('pulumi-uier-production-{0}-{1}', inputs.command, github.run_id) }}
      cancel-in-progress: false
    env:
      # Pinned: otherwise the action uses whatever Pulumi CLI the runner image ships. CLI and SDK are
      # released together; keep this equal to @pulumi/pulumi in infra/package.json (Renovate groups them).
      # renovate: datasource=npm depName=@pulumi/pulumi
      PULUMI_VERSION: "3.273.0"
      # State and Key Vault use the verified Azure CLI OIDC session, regardless of runner host.
      # A non-Azure metadata endpoint can stop DefaultAzureCredential before its CLI fallback.
      AZURE_TOKEN_CREDENTIALS: AzureCLICredential
    # No job-level `defaults.run.working-directory: infra`: the first step runs before checkout,
    # when infra/ does not exist yet, so each step that needs infra/ sets it itself.
    steps:
      - name: Validate inputs
        env:
          COMMAND: ${{ inputs.command }}
        run: |
          case "$COMMAND" in
            preview) ;;
            up) [ "$GITHUB_REF" = refs/heads/main ] || exit 1 ;;
            *) echo "::error::Unsupported Pulumi command '$COMMAND' (expected preview or up)"; exit 1 ;;
          esac

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # infra/ is a standalone pnpm project with its own lockfile and packageManager pin.
      # Pinned to the exact release: the floating v6 tag (v6.0.10) predates pnpm v12 support.
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: infra/package.json

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: infra/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: infra
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        if: inputs.command == 'preview'
        working-directory: infra
        run: pnpm typecheck

      - name: Build
        working-directory: infra
        run: pnpm build

      - name: Test infrastructure helpers
        working-directory: infra
        run: pnpm test

      # pulumi/actions skips its download (~12s) when the `pulumi` on PATH already satisfies
      # pulumi-version, and installs into ~/.pulumi/bin otherwise, which is what gets cached here.
      # Plugins are not cached: they download in about a second, faster than restoring them.
      - name: Cache Pulumi CLI
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.pulumi/bin
          key: ${{ runner.os }}-pulumi-cli-${{ env.PULUMI_VERSION }}

      - name: Add Pulumi CLI to PATH
        run: echo "$HOME/.pulumi/bin" >> "$GITHUB_PATH"

      - name: Install the pinned Pulumi CLI
        run: |
          if [ ! -x "$HOME/.pulumi/bin/pulumi" ]; then
            curl --fail --silent --show-error --location https://get.pulumi.com | sh -s -- --version "$PULUMI_VERSION"
          fi

      - name: Azure login (OIDC)
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Verify the OIDC identity
        env:
          EXPECTED_CLIENT: ${{ secrets.AZURE_CLIENT_ID }}
        run: |
          actual_client="$(az account show --query user.name -o tsv)"
          [ "$actual_client" = "$EXPECTED_CLIENT" ] || { echo "::error::Unexpected Azure identity"; exit 1; }
          echo "Azure environment OIDC identity verified."

      - name: Verify state backend authentication
        env:
          AZURE_STORAGE_ACCOUNT: ${{ secrets.AZURE_STORAGE_ACCOUNT }}
        run: pulumi login azblob://states --non-interactive

      - name: Preserve optional production variables for the preview
        if: inputs.command == 'preview'
        working-directory: infra
        env:
          PULUMI_BACKEND_URL: azblob://states
          AZURE_STORAGE_ACCOUNT: ${{ secrets.AZURE_STORAGE_ACCOUNT }}
        run: node scripts/preview-environment.mjs

      - name: Pulumi ${{ inputs.command }}
        uses: pulumi/actions@96c7761824268174e0d2a4e8c7d75671eebd24a7 # v7
        with:
          pulumi-version: ${{ env.PULUMI_VERSION }}
          command: ${{ inputs.command }}
          stack-name: organization/uier/uier-production
          work-dir: infra
          cloud-url: azblob://states
          comment-on-pr: ${{ github.event_name == 'pull_request' }}
          comment-on-summary: true
          always-include-summary: true
          suppress-outputs: true
          suppress-progress: true
        env:
          # State backend (azblob://states). No account key: Pulumi authenticates with the Azure CLI
          # session from azure/login (role "Storage Blob Data Contributor" on the states container).
          AZURE_STORAGE_ACCOUNT: ${{ secrets.AZURE_STORAGE_ACCOUNT }}
          # azure-native provider
          ARM_USE_OIDC: "true"
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          # @pulumiverse/vercel provider
          VERCEL_API_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          # @pulumi/cloudflare provider (DNS for the uier.io zone)
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # Becomes production's ANTHROPIC_API_KEY on Vercel when the production environment secret is set
          ANTHROPIC_API_KEY: ${{ inputs.command == 'up' && secrets.ANTHROPIC_API_KEY || '' }}
          UIER_INTEGRATION_ENV: ${{ inputs.command == 'up' && secrets.UIER_INTEGRATION_ENV || '' }}
