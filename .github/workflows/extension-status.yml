name: Extension store status

on:
  workflow_dispatch:
    inputs:
      inspect_store:
        description: 'Bootstrap: verify Google/store access with one read, without a release journal'
        type: boolean
        default: false
      tag:
        description: 'Extension release tag (blank selects the newest journal)'
        type: string
  schedule:
    - cron: '17 */6 * * *'

permissions: {}
concurrency:
  group: extension-production-store-item
  cancel-in-progress: false

jobs:
  inspect:
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.inspect_store
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: extension-production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
      - name: Obtain a fresh read-only publisher token
        id: google
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/chromewebstore.readonly
          create_credentials_file: false
          export_environment_variables: false
      - name: Verify the actual store item without writing
        env:
          CWS_PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
          CWS_EXTENSION_ID: ${{ vars.CWS_EXTENSION_ID }}
          CWS_ACCESS_TOKEN: ${{ steps.google.outputs.access_token }}
        run: node apps/extension/scripts/inspect-store.mjs

  status:
    if: github.ref == 'refs/heads/main' && !inputs.inspect_store && (github.event_name == 'workflow_dispatch' || vars.CWS_STATUS_MONITOR_ENABLED == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: extension-production
    permissions:
      contents: write # Update the existing draft receipt; no package or store write.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
      - name: Select bounded release journal
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: node apps/extension/scripts/publish.mjs select-status
      - name: Read status using a fresh short-lived token
        if: steps.select.outputs.tag != ''
        id: google
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/chromewebstore.readonly
          create_credentials_file: false
          export_environment_variables: false
      - name: Record the target version's actual state
        if: steps.select.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.select.outputs.tag }}
          CWS_PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
          CWS_EXTENSION_ID: ${{ vars.CWS_EXTENSION_ID }}
          CWS_ACCESS_TOKEN: ${{ steps.google.outputs.access_token }}
        run: node apps/extension/scripts/publish.mjs status
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: extension-store-status
          path: apps/extension/release/*.store.json
          if-no-files-found: ignore
          retention-days: 90
