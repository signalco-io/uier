# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

# Weekly: when shipped extension source changed since the newest release tag, open the version
# pull request. Release owners still create the protected tag and approve the store submission.
# See docs/browser-extension-release.md, "Regular releases".
name: Extension release prepare

on:
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:
    inputs:
      force:
        description: 'Prepare a release even without shipped source changes (dependency updates)'
        type: boolean
        default: false

permissions: {}

concurrency:
  group: extension-release-prepare
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-slim
    timeout-minutes: 10
    permissions:
      contents: write # Push the version branch only; tags stay with release owners.
      pull-requests: write
      actions: write # Pull requests opened with GITHUB_TOKEN start no workflows; dispatch CI.
    steps:
      # Credentials stay for the branch push. The job installs nothing and runs only main's scripts.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
      - name: Compare shipped source with the newest release tag
        id: plan
        env:
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force }}
          RELEASE_BODY: ${{ runner.temp }}/release-body.md
        run: node apps/extension/scripts/release-plan.mjs plan
      - name: Open the version pull request
        if: steps.plan.outputs.state == 'due'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.plan.outputs.version }}
          RELEASE_BODY: ${{ runner.temp }}/release-body.md
        run: |
          branch="extension-release/v$VERSION"
          if git ls-remote --exit-code --heads origin "$branch" > /dev/null; then
            echo "Version $VERSION is already prepared on $branch." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git switch --create "$branch"
          node apps/extension/scripts/release-plan.mjs version "$VERSION"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit --all --message "chore(extension): release $VERSION"
          git push origin "$branch"
          url=$(gh pr create --base main --head "$branch" --title "chore(extension): release $VERSION" --body-file "$RELEASE_BODY")
          gh workflow run ci.yml --ref "$branch"
          echo "Opened $url for extension $VERSION and started CI." >> "$GITHUB_STEP_SUMMARY"
      - name: Report a merged version without its release tag
        if: steps.plan.outputs.state == 'untagged'
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          message="Extension $VERSION is on main without its release tag. A release owner creates extension-v$VERSION; see docs/browser-extension-release.md#regular-releases."
          echo "$message" >> "$GITHUB_STEP_SUMMARY"
          echo "::error::$message"
          exit 1
