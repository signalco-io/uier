# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

# Daily: unchanged toolbar source is a no-op. Successful version PR CI completes the release.
name: Extension release prepare

on:
  schedule:
    - cron: '17 7 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Prepare a release without toolbar changes (manual maintenance only)'
        type: boolean
        default: false

permissions: {}

concurrency:
  group: extension-release-automation
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest # Git and OpenSSH for the trusted release-branch push.
    timeout-minutes: 10
    environment: extension-release-automation
    permissions:
      contents: write
      pull-requests: write
      actions: write # Resume finalization of an interrupted, already merged version.
    steps:
      # Credentials stay for the branch push. The job installs nothing and runs only main's scripts.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
      - name: Prepare only when the toolbar changed
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force }}
          RELEASE_SSH_KEY: ${{ secrets.EXTENSION_RELEASE_SSH_KEY }}
        run: node apps/extension/scripts/release-automation.mjs prepare
