# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: "Deployment freshness (reusable)"

on:
  workflow_call:
    outputs:
      current:
        description: "Whether this is still the newest eligible production deployment run."
        value: ${{ jobs.current.outputs.current }}

permissions: {}

jobs:
  current:
    name: "Check for a newer production release"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      current: ${{ steps.current.outputs.current }}
    steps:
      # Query eligible Deploy runs, not main's HEAD: a documentation-only push does not
      # trigger Deploy and must not suppress the preceding application release.
      # No checkout, repository executables, deployment credentials or environment.
      - name: Check the newest eligible run
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          latest_run_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/deploy.yml/runs?branch=main&per_page=1" --jq '.workflow_runs[0].id')"
          if ! [[ "$latest_run_id" =~ ^[0-9]+$ ]]; then
            echo "::error::Could not identify the newest production deployment run."
            exit 1
          fi
          if [ "$latest_run_id" -gt "$GITHUB_RUN_ID" ]; then
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "Superseded by ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${latest_run_id}." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "current=true" >> "$GITHUB_OUTPUT"
          fi
