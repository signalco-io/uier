# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

# main -> stack uier-production + Vercel production (uier.io)
#
# Build and infrastructure run together. The final upload waits for both: the Vercel project
# (rootDirectory, env vars, domains) must be up to date before the production deployment.

name: "Deploy"

on:
  push:
    branches:
      - main
    paths-ignore:
      - "*.md"
      - "LICENSE"
      - "renovate.json"
      # Browser packages ship separately from the web app.
      - "apps/extension/**"
      - "apps/extension-firefox/**"
      - "packages/extension/**"
      - ".github/ISSUE_TEMPLATE/**"
      # Agent skills and settings; nothing deployed reads them.
      - ".claude/**"
      - ".agents/**"
  workflow_dispatch:

# One deploy at a time; never cancel a running deploy.
# A newer push replaces a deploy that is still waiting; infra and web always deploy in full,
# so the newest commit carries everything the replaced one would have deployed. Freshness checks
# skip superseded work before building/applying and before uploading, without interrupting an apply.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  current:
    name: "Before production work"
    if: github.ref == 'refs/heads/main'
    permissions:
      actions: read
    uses: ./.github/workflows/deploy-current_reusable.yml

  build:
    name: "Web (production build)"
    needs: current
    if: needs.current.outputs.current == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/vercel-build_reusable.yml
    with:
      production: true

  infra:
    name: "Infra (pulumi up)"
    needs: current
    if: needs.current.outputs.current == 'true'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/pulumi_reusable.yml
    # Explicit names enable the target job environment to supply its secrets.
    secrets:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      AZURE_STORAGE_ACCOUNT: ${{ secrets.AZURE_STORAGE_ACCOUNT }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      UIER_INTEGRATION_ENV: ${{ secrets.UIER_INTEGRATION_ENV }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      SLACK_SIGNING_SECRET: ${{ secrets.SLACK_SIGNING_SECRET }}
    with:
      command: up

  publish-current:
    name: "Before production upload"
    needs: [infra, build]
    permissions:
      actions: read
    uses: ./.github/workflows/deploy-current_reusable.yml

  web:
    name: "Web (Vercel deploy)"
    needs: publish-current
    if: needs.publish-current.outputs.current == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/vercel-deploy_reusable.yml
    # Explicit names enable the target job environment to supply its secrets.
    secrets:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    with:
      production: true

  proof-html:
    name: "Bind the production proof hostname"
    needs: [web, build]
    if: github.ref == 'refs/heads/main' && needs.build.outputs.proof-html-origin != ''
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 5
    permissions:
      contents: read
    concurrency:
      group: file-proof-html-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/proofs/vercel.mjs
            /.github/vercel-project.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "26"
      - name: Verify the release and bind its isolated proof hostname
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          UIER_PROOF_DEPLOYMENT: ${{ needs.web.outputs.url }}
          UIER_PROOF_HTML_ORIGIN_PRODUCTION: ${{ needs.build.outputs.proof-html-origin }}
          UIER_PROOF_HTML_ORIGIN_PREVIEW: ${{ vars.UIER_PROOF_HTML_ORIGIN_PREVIEW }}
        run: |
          node --input-type=module -e '
            import { configureHtml } from "./.github/proofs/vercel.mjs";
            await configureHtml("production", { requirePublished: true });
          '

  indexnow:
    name: "Notify search engines of changed public pages"
    needs: [web, build]
    if: needs.build.outputs.public-pages-changed == 'true'
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: indexnow-before-${{ github.run_id }}
      - run: node .github/scripts/search-index.mjs submit indexnow-before.json
