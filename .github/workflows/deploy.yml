# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

# main -> stack uier-production + Vercel production (uier.io)
#
# Infrastructure always goes first: the Vercel project (rootDirectory, env vars, domains)
# is managed by Pulumi and has to be up to date before the production deployment.

name: "Deploy"

on:
  push:
    branches:
      - main
    paths-ignore:
      - "*.md"
      - "LICENSE"
      - "renovate.json"
      - ".github/ISSUE_TEMPLATE/**"
  workflow_dispatch:

# One deploy at a time; never cancel a running deploy.
# A newer push replaces a deploy that is still waiting; infra and web always deploy in full,
# so the newest commit carries everything the replaced one would have deployed.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  infra:
    name: "Infra (pulumi up)"
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/pulumi_reusable.yml
    # Explicit names enable the target job environment to supply its secrets.
    secrets:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      AZURE_STORAGE_ACCOUNT: ${{ secrets.AZURE_STORAGE_ACCOUNT }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      UIER_INTEGRATION_ENV: ${{ secrets.UIER_INTEGRATION_ENV }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    with:
      command: up

  web:
    name: "Web (Vercel deploy)"
    needs: infra
    permissions:
      contents: read
    uses: ./.github/workflows/vercel-deploy_reusable.yml
    # Explicit names enable the target job environment to supply its secrets.
    secrets:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    with:
      production: true

  indexnow:
    name: "Notify search engines of changed public pages"
    needs: web
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: indexnow-before-${{ github.run_id }}
      - run: node .github/scripts/search-index.mjs submit indexnow-before.json
