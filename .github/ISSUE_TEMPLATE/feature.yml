name: Suggest a feature
description: Describe a problem uier could help you solve.
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe your workflow and what is missing.
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: What would help?
      description: Explain the change you would like and any alternatives you have tried.
    validations:
      required: true
